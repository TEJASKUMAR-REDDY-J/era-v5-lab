<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">The count chain</title>
  <desc id="d">Example from the synthetic end-to-end test: 13 cleaned documents, 11 after dedup, 9 final. On the right, the equalities the runner checks between stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#14123a"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="b2" x1="0" x2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="b3" x1="0" x2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <clipPath id="bars">
      <rect x="40" y="154" width="560" height="44" rx="10"/>
      <rect x="40" y="234" width="474" height="44" rx="10"/>
      <rect x="40" y="314" width="388" height="44" rx="10"/>
    </clipPath>
  </defs>
  <style>
    .kick{font:700 13px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;letter-spacing:3px;fill:#2dd4bf}
    .h{font:700 24px 'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#f8fafc}
    .lab{font:600 14px 'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#cbd5e1}
    .n{font:800 22px 'Segoe UI',Inter,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#0b1020}
    .delta{font:700 13px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
    .eq{font:500 14px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#e2e8f0}
    .op{fill:#64748b}
    .ok{font:700 14px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#34d399}
    .note{font:500 12.5px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#64748b}
    .tick{animation:tick 3.6s ease-in-out infinite}
    .k1{animation-delay:0s}.k2{animation-delay:.3s}.k3{animation-delay:.6s}.k4{animation-delay:.9s}.k5{animation-delay:1.2s}.k6{animation-delay:1.5s}.k7{animation-delay:1.8s}
    @keyframes tick{0%,100%{opacity:.35}30%,60%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/><rect width="1200" height="400" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="22" fill="none" stroke="#334155" stroke-opacity="0.7"/>

  <text x="40" y="44" class="kick">THE COUNT CHAIN</text>
  <text x="40" y="76" class="h">Every stage must account for every document</text>
  <text x="40" y="104" class="note">example: the synthetic end-to-end test (tests/test_run_pipeline.py)</text>

  <!-- bars -->
  <g>
    <text x="40" y="146" class="lab">cleaned</text>
    <rect x="40" y="154" width="0" height="44" rx="10" fill="url(#b1)">
      <animate attributeName="width" from="0" to="560" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
    </rect>
    <text x="56" y="184" class="n">13</text>

    <text x="40" y="226" class="lab">after dedup</text>
    <rect x="40" y="234" width="0" height="44" rx="10" fill="url(#b2)">
      <animate attributeName="width" from="0" to="474" dur="1.1s" begin="0.35s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
    </rect>
    <text x="56" y="264" class="n">11</text>
    <text x="530" y="262" class="delta" fill="#fda4af">− 2 duplicates</text>

    <text x="40" y="306" class="lab">final</text>
    <rect x="40" y="314" width="0" height="44" rx="10" fill="url(#b3)">
      <animate attributeName="width" from="0" to="388" dur="1.1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
    </rect>
    <text x="56" y="344" class="n">9</text>
    <text x="444" y="342" class="delta" fill="#fcd34d">− 2 benchmark copies</text>

    <g clip-path="url(#bars)">
      <rect x="-120" y="150" width="120" height="212" fill="url(#sh)">
        <animate attributeName="x" from="-120" to="680" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- invariants -->
  <rect x="690" y="124" width="470" height="244" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="712" y="152" class="kick" style="fill:#a78bfa">CHECKED BY THE RUNNER</text>
  <g>
    <text x="712" y="184" class="eq">overlap.documents_all <tspan class="op">=</tspan> clean.rows</text>
    <text x="1130" y="184" class="ok tick k1" text-anchor="end">✓</text>
    <text x="712" y="210" class="eq">dedup.removed <tspan class="op">=</tspan> rows(remove_list)</text>
    <text x="1130" y="210" class="ok tick k2" text-anchor="end">✓</text>
    <text x="712" y="236" class="eq">dedup.heldout_removed <tspan class="op">=</tspan> 0</text>
    <text x="1130" y="236" class="ok tick k3" text-anchor="end">✓</text>
    <text x="712" y="262" class="eq">apply.rows <tspan class="op">=</tspan> clean.rows</text>
    <text x="1130" y="262" class="ok tick k4" text-anchor="end">✓</text>
    <text x="712" y="288" class="eq">apply.removed <tspan class="op">=</tspan> rows(remove_list)</text>
    <text x="1130" y="288" class="ok tick k5" text-anchor="end">✓</text>
    <text x="712" y="314" class="eq">f2.rows <tspan class="op">=</tspan> apply.kept</text>
    <text x="1130" y="314" class="ok tick k6" text-anchor="end">✓</text>
    <text x="712" y="340" class="eq">f2.kept + dropped + errors <tspan class="op">=</tspan> f2.rows</text>
    <text x="1130" y="340" class="ok tick k7" text-anchor="end">✓</text>
  </g>
</svg>
